# =============================================
# H2 In-Memory Database (local development)
# To switch to MySQL, comment out the H2 block
# and uncomment the MySQL block below.
# =============================================

# --- H2 (local dev) --- file-based so data persists across restarts ---
spring.datasource.url=jdbc:h2:file:./data/autotransport;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL (production) --- uncomment and fill in when MySQL is available ---
# spring.datasource.url=jdbc:mysql://localhost:3306/autotransport?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Run data.sql after Hibernate creates/updates the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Disable devtools auto-restart (prevents mid-request failures that show "Error calling server")
spring.devtools.restart.enabled=false

# =============================================
# Multipart (large document uploads)
# =============================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# =============================================
# Server
# =============================================
server.port=8080

# =============================================
# Thymeleaf
# =============================================
spring.thymeleaf.cache=false
